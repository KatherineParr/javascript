<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- tope -->
    <h1>Sistema de Facturación</h1>
    <hr>


    <!-- AÑADIR PRODUCTOS FORMULARIO -->
    <h2>Añadir Producto</h2>
    <hr>

    <div id="formProducto">

        <!-- poner cada en div pa usar el flex y que el label quede arriba -->
        <div>
            <label for="inpConcepto">Concepto:</label>
            <input type="text" name="concepto" id="inpConcepto">
        </div>
        <div>
            <label for="inpCant">Cantidad:</label>
            <input type="number" name="cantidad" id="inpCant" value="1">
        </div>
        <div>
            <label for="inpPrecio">Precio(€):</label>
            <!-- ponemos step con un decimal para que los acepte, y con lo num destras del . para cuantos decimales acepta -->
            <input type="number" step="0.01" name="precio" id="inpPrecio">
        </div>

        <button id="insertar">Insertar</button>

    </div>



    
    <!-- IMPUESTOS Y CIRCLES -->
    <h2>Seleccionar Impuestos</h2>
    <hr>

    <!-- botones de input -->

    <div id="btnImpuesto">

        <!-- label para poder añadir el % sin tener que luego mpdificar el value en el js -->
        <input type="radio" name="impuesto" value="5" id="imp5">
        <label for="imp5">5%</label>

        <input type="radio" name="impuesto" value="10" id="imp10">
        <label for="imp10">10%</label>

        <input type="radio" name="impuesto" value="15" id="imp15">
        <label for="imp15">15%</label>

        <input type="radio" name="impuesto" value="20" id="imp20" checked>
        <label for="imp20">20%</label>

    </div>




    <!-- TABLA Y FACTURA -->
    <h2>Factura</h2>
    <hr>

    <!-- tabla -->
     <table>

        <thead>
            <tr>
                <th>Concepto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Precio Total</th>
                <th>Eliminar</th>
            </tr>
        </thead>

        <tbody id="tabla-body">

        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Subtotal:</td>
                <!-- span pa que recoga solo el numero y deje el € solo -->
                <td colspan="2"><span id="numSub">0</span> €</td>
            </tr>
            <tr>
                <td colspan="3">Tasa:</td>
                <td colspan="2"><span id="numTasa">0</span> %</td>
            </tr>
            <tr>
                <td colspan="3">Impuestos:</td>
                <td colspan="2"><span id="numImp">0</span> €</td>
            </tr>
            <tr id="trTotal">
                <td colspan="3">TOTAL:</td>
                <td colspan="2"><span id="numTotal">0</span> €</td>
            </tr>
        </tfoot>

     </table>
</body>
</html>
