<!--Ejercicio 1:
Crea dos páginas web (pag1.html y pag2.html). Ambas páginas tienen un enlace a
la otra página.
En pag1.html hay un formulario con un campo para insertar el nombre y otro para
insertar la edad. También hay un botón “guardar” para enviar el formulario.
Cuando se pulse guardar se debe almacenar los datos en local. Puedes hacer que
directamente te lleve a la página 2 o que se mantenga en la página y tengas que
pulsar el enlace.
En pag2.html debe aparecer una etiqueta para el nombre y otra para la edad.
En caso de que no hubiera datos almacenados para el nombre o la edad, o
estuviesen vacíos, debe aparecer estos textos por defecto. En caso de que si
hubiese datos, se mostrarán.
También debe haber un botón que permita eliminar los datos almacenados..-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>



    <form id="formulario">
        <label for="inputNombre">Nombre:</label>
        <input type="text" id="inputNombre">

        <label for="inputEdad">Edad:</label>
        <input type="number" id="inputEdad">

        <input type="submit" value="Guardar" id="almacenar">

    </form>




</body>
</html>
