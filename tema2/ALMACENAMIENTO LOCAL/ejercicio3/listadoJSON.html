<!--Ejercicio 3
Vamos a crear un listado de tareas en local y persistente. Es decir, que no se
borren.
Crea un formulario con un campo de texto donde se indica la tarea y un botón para
crearla.
Se debe mostrar en un listado dicha tarea. Al crearla también se debe almacenar en
local. De esta forma al volver a cargar la página se deben mostrar las tareas
creadas.
CONSEJO: JSON admite objetos y arrays. Por tanto, los arrays se pueden convertir
a JSON recuperar tal y como si fueran objetos.
Mejoras que se pueden realizar:
● Añadir la funcionalidad de poder eliminar una tarea de la lista.
● Ordenar las tareas alfabéticamente.
● Filtrar las tareas que se muestran mediante un campo buscar.
● Añadir a cada tarea campos adicionales como fecha o prioridad.
○ Ordenar las tareas por alguno de estos campos.
○ Filtrar por alguno de estos campos o conjunto de ellos.-->
