<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Lista</title>
</head>
<body>
    <h1>Lista</h1>
    <script>
        const fruits = [];
        fruits.push('apple');
        fruits.push('orange');
        fruits.push('piña', 'uva'); <!--push pude empujar varios elementos, no solo uno necesariamente-->
        console.log(fruits);
        alert(fruits); <!--no recomendable-->
        let data = prompt('introduce un texto') <!--el prompt es para introducir datos-->
        console.log(data)
    </script>
</body>
</html>
