    <h1>EJ 5</h1>
    <script>
        //Descripción: Escribe una función que reciba un array de números 
        // y devuelva la suma de todos sus elementos.

        //NOTA PARA SELF, CONST ES CUANDO NO VAYAS A CAMBIAR LA variable
        //LET ES CUANDO SE TENGA QUE CAMBIAR, DARA ERROR
        //SI DECLARAS UNA COST Y TIENE QUE CAMBIAR

        const numeros = [1, 2, 3, 4, 5]; 
        

        function sumaArray(numeros){
            let suma = 0
            numeros.forEach(numero => {
                suma += numero
            });
            return suma
        }

        console.log(sumaArray(numeros))
    </script>

    <h1>EJ 6</h1>
    <script>
        //Escribe una función que reciba un array de números 
        //y devuelva el número mayor.

        const numeros1 = [1, 2, 3, 4, 5]; 
        //hay dos formas, la sencilla

        function mayorArrayS(numeros){
            //se declara una variable con valor del primer
            //elemento del array asignado
            let mayor = numeros[0];
            //recorremos el array que se pasa con un for
            for (let i = 1; i < numeros.length; i++) {
                //si el elemento tal i es mayor que mayor (primer elemento
                //de numeros)
                if (numeros[i] > mayor) {
                    //se le asigna ese valor a mayor
                    mayor = numeros[i];
                }
            }   

            //y el array se recorre completo hasta el final, viendo
            //si otro elemento es mayor, si no lo es no hace nada
            //y si lo es se le asigna, y devolvemos ese valor

            return mayor;
        }

        console.log(mayorArrayS(numeros1))

        //y la forma mas directa con MAth max, que saca el maximo

        function mayorArrayM(numeros){
            return Math.max(...numeros)
            //hay que usar los dos .., spread, porque lo que hace es 
            // abrir el array y convertirlo a numeros sueltos
        }

        

        console.log(mayorArrayM(numeros1))

    </script>
